[package]
name = "rojo-project-types"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MPL-2.0"
description = "Reusable Rojo project tree and property value types."
publish = false

[dependencies]
anyhow = "1.0.80"
rbx_dom_weak = "4.2.0"
rbx_reflection = "7.0.0"
rbx_reflection_database = "3.0.1"
serde = { version = "1.0.197", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.145"
